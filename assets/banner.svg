<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#211a15"/>
      <stop offset="1" stop-color="#2e211a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97757"/>
      <stop offset="1" stop-color="#e8956f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glow)"/>

  <!-- 번개 아이콘 -->
  <path d="M118 62 L84 138 L110 138 L96 196 L146 112 L118 112 L138 62 Z" fill="url(#accent)"/>

  <!-- 타이틀 -->
  <text x="176" y="112" font-size="52" font-weight="800" fill="#f7f0ea">Claude Code</text>
  <text x="176" y="164" font-size="34" font-weight="700" fill="url(#accent)">원클릭 설치 · One-Click Install</text>
  <text x="176" y="212" font-size="20" fill="#c9b9ac">터미널을 몰라도 괜찮아요 — 명령어 한 줄이면 끝</text>
  <text x="176" y="244" font-size="20" fill="#a8988c">No terminal experience needed. Paste one line, done.</text>

  <!-- 플랫폼 뱃지 -->
  <rect x="176" y="268" width="130" height="36" rx="18" fill="#3a2c22"/>
  <text x="241" y="292" font-size="17" font-weight="700" fill="#e8d9cc" text-anchor="middle">🍎 macOS</text>
  <rect x="318" y="268" width="140" height="36" rx="18" fill="#3a2c22"/>
  <text x="388" y="292" font-size="17" font-weight="700" fill="#e8d9cc" text-anchor="middle">🪟 Windows</text>
  <rect x="470" y="268" width="130" height="36" rx="18" fill="#3a2c22"/>
  <text x="535" y="292" font-size="17" font-weight="700" fill="#e8d9cc" text-anchor="middle">+ Node.js</text>

  <!-- 터미널 목업 -->
  <g>
    <rect x="680" y="44" width="470" height="252" rx="14" fill="#171210" stroke="#4a382c" stroke-width="1.5"/>
    <rect x="680" y="44" width="470" height="38" rx="14" fill="#241c17"/>
    <rect x="680" y="68" width="470" height="14" fill="#241c17"/>
    <circle cx="706" cy="63" r="7" fill="#ff5f57"/>
    <circle cx="728" cy="63" r="7" fill="#febc2e"/>
    <circle cx="750" cy="63" r="7" fill="#28c840"/>
    <text x="915" y="69" font-size="15" fill="#8a776a" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">claude-code-one-click</text>

    <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16">
      <text x="704" y="116" fill="#7fd18a">$</text>
      <text x="722" y="116" fill="#e8ddd3">curl -fsSL https://…/install-mac.sh | bash</text>
      <text x="704" y="150" fill="#d97757">[1/6]</text>
      <text x="762" y="150" fill="#c9b9ac">환경 확인</text>
      <text x="856" y="150" fill="#28c840">✓</text>
      <text x="704" y="182" fill="#d97757">[2/6]</text>
      <text x="762" y="182" fill="#c9b9ac">Claude Code 설치</text>
      <text x="928" y="182" fill="#28c840">✓</text>
      <text x="704" y="214" fill="#d97757">[5/6]</text>
      <text x="762" y="214" fill="#c9b9ac">Node.js 설치</text>
      <text x="890" y="214" fill="#28c840">✓</text>
      <text x="704" y="252" fill="#7fd18a" font-weight="700">🎉 설치 성공! Claude를 시작합니다…</text>
      <rect x="704" y="264" width="11" height="19" fill="#d97757">
        <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
